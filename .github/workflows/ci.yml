name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      OC_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OC_TEST_REQUIRE_SIGNER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Module boundaries (import-linter)
        run: uv run lint-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: signer/package-lock.json
      - name: Start signer against the test database
        working-directory: signer
        run: |
          npm ci --no-audit --no-fund
          npm run build
          OC_ENV=test SIGNER_DATABASE_URL=postgresql://oc_signer:oc_signer_dev@localhost:5432/opencredential_test \
            nohup node dist/server.js > "$RUNNER_TEMP/signer.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8790/healthz && break; sleep 1; done
      - name: Pytest (unit + integration against PostgreSQL 16 and the signer)
        run: uv run pytest -ra
      - name: Signer log
        if: failure()
        run: cat "$RUNNER_TEMP/signer.log"

  conformance:
    # Done-when for W4: credentials issued by the app pass verifiers we did not write, and a
    # downloaded copy of a revoked credential reads as revoked.
    name: Independent OB 3.0 verifiers (DCC, 1EdTech)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      OUT: ${{ github.workspace }}/conformance-out
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start the stack (database, signer, API)
        run: |
          sh docker/postgres/init/01-roles.sh
          (cd backend && uv sync --frozen && uv run oc migrate)
          (cd signer && npm ci --no-audit --no-fund && npm run build)
          (cd signer && OC_ENV=development nohup node dist/server.js > "$RUNNER_TEMP/signer.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:8790/healthz && break; sleep 1; done
          (cd backend && uv run oc seed)
          (cd backend && nohup uv run oc api > "$RUNNER_TEMP/api.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
      - name: Issue credentials, revoke one
        run: tests/conformance/run-conformance.sh "$OUT"
      - name: Students download and share them (W6, through the student endpoints)
        working-directory: backend
        run: uv run python ../tests/conformance/student_share.py "$OUT/student"
      - name: DCC verifier-core (signature, expiry, status list, JSON Schema)
        working-directory: tests/conformance/dcc
        env:
          DCC_REQUIRE_SCHEMA: "1"
        run: |
          npm ci --no-audit --no-fund
          node verify.mjs active "$OUT"/active/*.json
          node verify.mjs revoked "$OUT"/revoked/*.json
          node verify.mjs active "$OUT"/student/*.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 1EdTech OB 3.0 inspector (digital-credentials-public-validator)
        run: |
          git clone --filter=blob:none https://github.com/1EdTech/digital-credentials-public-validator.git "$RUNNER_TEMP/dcpv"
          cd "$RUNNER_TEMP/dcpv"
          git checkout 4c6631fb5ea206ee60c2e7128749b44d70801098
          cp "$OUT"/student/*.json "$OUT"/active/
          cp "$GITHUB_WORKSPACE/tests/conformance/1edtech/OpenCredentialConformanceTest.java" \
            inspector-vc/src/test/java/org/oneedtech/inspect/vc/
          OC_CONFORMANCE_ACTIVE_DIR="$OUT/active" OC_CONFORMANCE_REVOKED_DIR="$OUT/revoked" \
            mvn -B -q -pl inspector-vc -am test -Dtest=OpenCredentialConformanceTest \
              -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-credentials
          path: conformance-out
      - name: Service logs
        if: failure()
        run: cat "$RUNNER_TEMP/signer.log" "$RUNNER_TEMP/api.log"

  e2e:
    # W8 (spec §19.3, §19.5): the twelve end-to-end scenarios and the accessibility suite, in a
    # real browser against the running stack (api, worker, signer, built frontend).
    name: End-to-end scenarios and accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      SIGNER_DATABASE_URL: postgresql://oc_signer:oc_signer_dev@localhost:5432/opencredential
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start the stack (database, signer, API with the built frontend, worker)
        run: |
          sh docker/postgres/init/01-roles.sh
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          (cd backend && uv sync --frozen && uv run oc migrate)
          (cd signer && npm ci --no-audit --no-fund && npm run build)
          (cd signer && OC_ENV=development nohup node dist/server.js > "$RUNNER_TEMP/signer.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:8790/healthz && break; sleep 1; done
          (cd backend && uv run oc seed)
          export OC_STATIC_DIR="$GITHUB_WORKSPACE/frontend/dist"
          (cd backend && nohup uv run oc api > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd backend && nohup uv run oc worker > "$RUNNER_TEMP/worker.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:8000/readyz && break; sleep 1; done
      - name: Playwright (E1–E12, WCAG 2.2 AA checks on desktop and phone)
        working-directory: tests/end_to_end
        env:
          OC_E2E_SIGNER_STOP: fuser -k 8790/tcp; sleep 1
          OC_E2E_SIGNER_START: >-
            cd "$GITHUB_WORKSPACE/signer" && (OC_ENV=development nohup node dist/server.js >> "$RUNNER_TEMP/signer.log" 2>&1 &) && sleep 2
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --trace off
      - name: Backup and restoration drill (destroy the database, restore, re-verify)
        env:
          OC_ADMIN_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
          OC_STORAGE_DIR: ${{ github.workspace }}/backend/var/assets
          OC_DRILL_STOP: pkill -f "[o]c api"; pkill -f "[o]c worker"; fuser -k 8790/tcp; sleep 2
          OC_DRILL_START: >-
            (cd "$GITHUB_WORKSPACE/signer" && OC_ENV=development nohup node dist/server.js >> "$RUNNER_TEMP/signer.log" 2>&1 &);
            sleep 2;
            (cd "$GITHUB_WORKSPACE/backend" && OC_STATIC_DIR="$GITHUB_WORKSPACE/frontend/dist" nohup uv run oc api >> "$RUNNER_TEMP/api.log" 2>&1 &);
            (cd "$GITHUB_WORKSPACE/backend" && nohup uv run oc worker >> "$RUNNER_TEMP/worker.log" 2>&1 &);
            sleep 3
        run: scripts/backup-restore-drill.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            tests/end_to_end/results
            tests/end_to_end/test-results
      - name: Service logs
        if: failure()
        run: cat "$RUNNER_TEMP/signer.log" "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/worker.log"

  signer:
    name: Signer (lint, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: signer/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pip-audit (runtime dependencies)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: npm audit (production dependencies)
        run: |
          (cd signer && npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high)
          (cd frontend && npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high)
      - name: Licence allowlist (ADR-0018)
        run: |
          (cd backend && uv sync --frozen --no-dev && uvx pip-licenses --python .venv/bin/python --format=json > "$RUNNER_TEMP/py-licences.json")
          python3 scripts/check_licences.py python "$RUNNER_TEMP/py-licences.json"
          python3 scripts/check_licences.py npm signer
          python3 scripts/check_licences.py npm frontend

  compose:
    name: Docker Compose smoke test (Phase 1 exit condition)
    runs-on: ubuntu-latest
    needs: [backend, signer, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
