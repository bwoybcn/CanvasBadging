# SPDX-License-Identifier: AGPL-3.0-or-later
# Publishes the explainer website in site/ to GitHub Pages whenever it changes on main.
#
# One-off setup by the repository owner: Settings > Pages > Build and deployment >
# Source: "GitHub Actions". Until then the deploy step fails with "Not Found".
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish to Pages
  id-token: write # prove the deployment came from this workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
