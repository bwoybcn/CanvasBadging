[project]
name = "opencredential"
version = "0.1.0"
description = "Open-source micro-credentialling and Open Badges 3.0 issuing for Canvas LMS"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "pydantic-settings>=2.6",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "psycopg[binary,pool]==3.3.9",
    "procrastinate==3.12.0",
    "joserfc==1.8.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "structlog==26.1.0",
    "uvicorn[standard]>=0.32",
    "typer>=0.12",
    "jsonschema==4.26.0",
    "reportlab==5.1.1",
    "resvg-py==0.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio>=0.24",
    "pytest-randomly==4.0.1",
    "hypothesis==6.170.17",
    "respx==0.23.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pyld==3.3.0",
    "base58==2.1.1",
    "pypdf>=7.1.0",
]

[project.scripts]
oc = "opencredential.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencredential"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"migrations/**" = ["E501", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs a PostgreSQL database (DATABASE_URL / OC_TEST_ADMIN_URL)",
    "canvas_live: runs against a real Canvas instance",
]
filterwarnings = [
    "error::DeprecationWarning:opencredential.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.mypy]
python_version = "3.12"
packages = ["opencredential"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.importlinter]
root_package = "opencredential"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Canvas types stay inside integrations.canvas"
type = "forbidden"
source_modules = [
    "opencredential.rules",
    "opencredential.authoring",
    "opencredential.issuance",
    "opencredential.credentials",
    "opencredential.authz",
]
forbidden_modules = ["opencredential.integrations.canvas"]

[[tool.importlinter.contracts]]
name = "Rules engine is pure (no I/O modules)"
type = "forbidden"
source_modules = ["opencredential.rules"]
forbidden_modules = ["opencredential.db", "opencredential.api", "opencredential.jobs", "httpx", "sqlalchemy"]
